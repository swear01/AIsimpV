# Direct HTTP APIs without an agent CLI; DeepSeek credentials belong to the local gateway.
[deepseek]
model = "deepseek-flash"
endpoint = "http://127.0.0.1:35001/v1/chat/completions"
auth = "local-gateway"
[deepseek.parameters]
reasoning_effort = "high"
max_tokens = 16384
thinking = { type = "enabled" }

[meta]
model = "muse-spark-1.3-contributor"
endpoint = "https://api.meta.ai/v1/chat/completions"
api_key_env = "META_API_KEY"
[meta.parameters]
reasoning_effort = "high"
max_completion_tokens = 16384
