name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned verification tools
        run: |
          python -m pip install uv==0.8.22 z3-solver==4.15.4.0
          sh scripts/bootstrap_yosys.sh
          z3 -version
      - name: Run unit and frontend checks
        run: |
          mkdir -p results
          python -m unittest discover -s tests -v 2>&1 | tee results/unit-tests.txt
      - name: Run the complete feasibility demo
        run: python -m rtl_relate demo --out results/ci-pilot
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-evidence
          path: results/
          retention-days: 14
          if-no-files-found: warn
